# litegrip_hw.yaml — PC-side runtime parameters for the LiteGrip gripper
# hardware daemon.
#
# Usage: litegrip_hw_daemon --hw-config <absolute path to this file>
#
# Precedence: **command line > this file > the defaults in the code**.
# To change one value temporarily there is no need to edit here; just add the
# command-line argument (the reverse does not work — the file cannot override
# the command line, and that is deliberate: a temporary change must not be
# silently overridden by a file someone forgot to delete).
#
# ⚠ An unknown key is **an outright error** (never silently ignored). A typo in
#   a config file that still picks up the old value is the hardest kind of
#   problem to track down.
#
# ⚠ **PC-side concepts only** live here. The single source of truth for
#   gripper-motor-level parameters (encoder range, MIT field ranges, ...) is the
#   SDK/protocol; this file does not copy them out a second time.

gripper:
  # ── hardware channel ────────────────────────────────────────────────────
  # Classic CAN (not FD), 1 Mbit/s (bittiming is configured system-side, see
  # setup_can.sh).
  # ★ can0 is provided by the **STM32 board's if0 gs_usb bridge** (the firmware
  #   forwards "outside the motor domain" CAN frames in both directions) — that
  #   is, this gripper path already goes through that board, it just takes the
  #   bypass rather than the CDC command port. The firmware's motor-domain
  #   blacklist isolates 0x01..07 / 0x11..17 / 0x7FF.
  channel: can0
  can_id: 8          # 0x08 gripper
  mst_id: 24         # 0x18 master / feedback
  canfd_mode: false

  # ── ★★ dual switch (both are required)───────────────────────────────────
  # The real-hardware path requires **dry_run=false and hardware_enable=true**
  # to hold at the same time. They are two switches because they block two
  # different things: dry_run blocks "do not touch hardware while debugging",
  # while hardware_enable blocks "is a gripper actually attached to this
  # machine". Merged into one, making the daemon report the true state would
  # require letting it drive the motor.
  #
  # ⚠ Before turning them on, confirm: the gripper is powered, nothing obstructs
  #   its range of motion, **no other process is holding can0** (this process
  #   takes it exclusively), and a hardware emergency stop is available.
  dry_run: true
  hardware_enable: false

  # ── control loop ────────────────────────────────────────────────────────
  # Background control loop rate. DM motors need a continuous stream of MIT
  # frames; the SDK's own streaming interface uses 200 Hz, and the default here
  # is 50 Hz (enough for holding position, and it leaves margin to check the
  # emergency stop / feedback).
  control_rate_hz: 50.0
  # How long without a **new** feedback frame counts as communication loss.
  # ⚠ The DM4310 has **polled** feedback: send no frame and no reply comes back.
  #   So a keepalive must be sent when idle, otherwise communication loss is
  #   falsely declared after ~0.5s of idling (see the notes in sdk_adapter).
  feedback_timeout_s: 0.5
  # This layer's temperature ceiling (°C), checked once for MOS and once for the
  # coil. This is "stop **before** the driver trips on its own" — the
  # over-temperature fault the SDK reports is already past that point.
  temperature_limit_c: 80
  # Stale-command criterion: hold position once no new command frame has arrived
  # for this long.
  command_timeout_s: 0.2

  # ── ★★ safety: command trajectory rate ceiling and torque budget─────────
  # In the old driver these two were **per-command fields**; they are now
  # **daemon parameters**: the command interface exposes position only (matching
  # the arm joints), while they describe "how this gripper is allowed to move" —
  # deployment configuration, which must not be decided by each command
  # publisher on its own (otherwise one slip of the hand would loosen the whole
  # torque argument). Changing them requires restarting the daemon, and that too
  # is deliberate.
  #
  # Command trajectory advance rate ceiling (rad/s); it can only be turned down,
  # never up.
  # ★ It is **not** the velocity setpoint in the MIT frame — the dq field in the
  #   frame is always 0. Its job is **before** the frame is sent: the daemon
  #   turns the target into a rate-limited trajectory, advancing towards the
  #   target by at most Δq ≤ max_velocity_rad_s × elapsed per cycle. Sending
  #   this value as dq would become "charge on at this speed forever" — a
  #   different and more dangerous motion (it has no endpoint).
  # ★ The first frame has no "previous trajectory point" to advance from, so it
  #   starts from the **measured position** (step size 0): there is no jump
  #   straight to the target on the first frame after power-up.
  # Why 0.436: the SDK's own v_allow stopping-distance model gives 0.4366 on the
  #   opening side and 0.6570 on the closing side at the current position; take
  #   the smaller and round down to 3 decimal places.
  #   ⚠ a=5.0 / t_comm=0.02 in that model are marked in the SDK as temporary
  #     experimental parameters **not yet measured on real hardware** ⇒ 0.436 is
  #     "the widest value that can currently be argued for", not "a
  #     confirmed-safe top speed". Tighten it for the actual working conditions
  #     before a real grasp.
  max_velocity_rad_s: 0.436

  # Maximum total control torque allowed for this motion (N·m); it can only be
  # turned down, never up.
  # ★★ It is **not** "the torque output continuously", and it is **not written
  #    into any field of the MIT frame**: it is **allocated** between the two
  #    position gains, stiffness and damping, so that kp·e_b + kd·v_b ≤ budget,
  #    where e_b / v_b are **worst-case bounds** (not the current samples). The
  #    reason: the kp/kd in a frame are handed to the **driver**, which computes
  #    with the error it measures in real time over the whole control period —
  #    scaling by the sampling instant only guarantees that one instant stays
  #    within budget. The allocation is **damping first** (if the budget is
  #    short, kp is cut first). Sending the budget as tau would turn the gripper
  #    into a constant-force pusher — a different and more dangerous motion.
  # 3.5 = the **rated torque** (output side) from page 6 of the DM-J4310-2EC
  # manual.
  # ⚠ This is "must not exceed", not "may be taken up to" — do not run at 3.5
  #   before the real grasp load has been calibrated.
  torque_limit_nm: 3.5

  # Versioned safety baseline: optionally "3.5" (current) or "0.25" (the
  # previous version, kept for rollback).
  # ★ The version named here is the one that **must** be loaded: an invalid
  #   version / a missing file / contents rewritten to be looser ⇒ the daemon
  #   rejects **all** commands (fail-closed) and never falls back to some
  #   default ceiling.
  safety_baseline: "3.5"

  # ── ★★ worst-case bounds (the safety argument for the torque budget)─────
  # **-1 means "not given"** (a sentinel value). -1 rather than 0/empty: 0 would
  # make validation throw outright, whereas what is wanted here is "parameter
  # not given = the real-hardware path is fail-closed", not "the daemon will not
  # start".
  #
  # Worst-case position error bound e_b (rad). -1 = derived from the **red line
  # width** (red_max − red_min = 1.23 rad; both the target and the reading are
  # forced by the SDK to stay inside the red line, so 1.23 is a derived bound,
  # not a made-up one).
  # ⚠ Given explicitly, the value **can only be tightened**: what is used is
  #   min(given value, red line width).
  max_position_error_rad: -1.0

  # Worst-case feedback velocity bound v_b (rad/s).
  # ⚠⚠ **Not given** by default, and "not given" = **refuse to send any motion
  #     frame**. This is not a default value to be muddled through with; it is
  #     deliberate fail-closed. To actually drive the gripper, this item
  #     **must** be calibrated on real hardware first.
  # Why no default can be invented for it: **nowhere** in the existing code is
  # an allowable upper bound on feedback velocity defined — the SDK only checks
  # that the measured dq_act is finite; the 30.0 rad/s in the protocol is the
  # **encoding range** of the 12-bit velocity field, not a protection threshold;
  # recovery_dq_max is the ceiling of a different path; v_allow() only looks at
  # dq_target; and the safety_limits JSON has no velocity field at all. Plug in
  # any of them and "the worst-case torque budget" becomes a claim no one can
  # test.
  # How to calibrate: run the gripper through **real working conditions**, take
  # the peak feedback velocity and add a suitable margin — it is the value "I
  # assert it will not exceed", not "the maximum I observed".
  max_feedback_velocity_rad_s: -1.0

  # MIT position gain upper bounds (the SDK's hard range is [0, 500]).
  # ⚠ kp and kd are only **upper bounds**: every published frame re-allocates
  #   them from that frame's budget using the worst-case bounds (see
  #   torque_limit_nm above). Damping first: if the budget is short kp is cut
  #   first; when the damping term fills the budget, kp is cut to 0 (that frame
  #   is nothing but a brake).
  kp: 20.0
  kd: 0.5

  # ── SDK location ────────────────────────────────────────────────────────
  # Points at the SDK copy **carried in this workspace** — that way the baseline
  # selected by safety_baseline is really loaded and takes effect. Empty ("")
  # leaves the daemon unable to obtain the red line, so it **rejects all
  # commands** (fail-closed); that is safe, but the baseline then does nothing —
  # do not treat empty as "one less thing to do".
  # ⚠ ROS 2 Humble uses /usr/bin/python3 (3.10), which is not interchangeable
  #   with miniconda.
  # ★ Deliberately left empty: this repository forbids putting machine-dependent
  #   absolute paths into the source (where the workspace goes is the deployer's
  #   decision). This workspace's SDK copy is in the sibling directory
  #   src/litegrip/sdk.
  sdk_path: ""
